<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIP - 야구가 있는 곳, 어디든 우리 집</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex justify-center items-start min-h-screen">
  <div id="app" class="w-full max-w-[430px] bg-white min-h-screen relative pb-24 font-sans text-gray-900 shadow-xl"></div>

  <script>
    let state = {
      activeTab: 'home',
      nickname: '야구집사',
      favoriteTeams: ['롯데 자이언츠', '치바 롯데 마린즈', '샌프란시스코 자이언츠'],
      showTeamModal: false,
      selectedDate: '2026-09-22',
      showAllGames: false,
      teamSearch: '',
      expandedContinent: '아시아',
      activeInfoModal: null
    };

    const continents = [
      { name: '아시아', leagues: [{ name: 'KBO', teams: ['롯데 자이언츠', '한화 이글스', 'LG 트윈스', '두산 베어스', 'KT 위즈', '삼성 라이온즈', 'NC 다이노스'] }, { name: 'NPB', teams: ['치바 롯데 마린즈', '오릭스 버팔로스', '요미우리 자이언츠'] }] },
      { name: '북미', leagues: [{ name: 'MLB', teams: ['샌프란시스코 자이언츠', 'LA 다저스', '뉴욕 양키스'] }] },
      { name: '남미·카리브', leagues: [{ name: 'LIDOM', teams: ['타이거스 델 레이세이'] }] },
      { name: '유럽', leagues: [{ name: 'DBL', teams: ['하이덴하임 헤비츠'] }] },
      { name: '오세아니아', leagues: [{ name: 'ABL', teams: ['멜버른 에이시스'] }] },
      { name: '여자야구', leagues: [{ name: 'WPBL', teams: ['로스앤젤레스 퀸스', '샌프란시스코 파이어벨스'] }] }
    ];

    const mockGamesByDate = {
      '2026-09-21': [
        { id: 11, league: 'KBO', homeTeam: 'LG 트윈스', awayTeam: '롯데 자이언츠', homeScore: 2, awayScore: 4, status: 'FINAL', stadium: '잠실야구장', time: '18:30' },
        { id: 12, league: 'MLB', homeTeam: 'LA 다저스', awayTeam: '샌프란시스코 자이언츠', homeScore: 5, awayScore: 3, status: 'FINAL', stadium: 'Dodger Stadium', time: '11:00' }
      ],
      '2026-09-22': [
        { id: 1, league: 'KBO', homeTeam: '한화 이글스', awayTeam: '롯데 자이언츠', homeScore: 3, awayScore: 5, status: 'FINAL', stadium: '사직야구장', time: '14:00' },
        { id: 2, league: 'NPB', homeTeam: '오릭스 버팔로스', awayTeam: '치바 롯데 마린즈', homeScore: 1, awayScore: 2, status: 'LIVE', stadium: 'ZOZO 마린', time: '18:00' },
        { id: 3, league: 'MLB', homeTeam: 'LA 다저스', awayTeam: '샌프란시스코 자이언츠', homeScore: 2, awayScore: 4, status: 'FINAL', stadium: 'Oracle Park', time: '10:00' }
      ],
      '2026-09-23': [
        { id: 21, league: 'KBO', homeTeam: '삼성 라이온즈', awayTeam: 'LG 트윈스', homeScore: 0, awayScore: 0, status: 'BEFORE', stadium: '대구삼성라이온즈파크', time: '18:30' },
        { id: 22, league: 'NPB', homeTeam: '치바 롯데 마린즈', awayTeam: '요미우리 자이언츠', homeScore: 0, awayScore: 0, status: 'BEFORE', stadium: 'ZOZO 마린', time: '18:00' }
      ]
    };

    const rankingsData = {
      KBO: [
        { rank: 1, team: 'KIA 타이거즈', wins: 80, losses: 50, rate: '.615' },
        { rank: 2, team: '삼성 라이온즈', wins: 75, losses: 56, rate: '.573' },
        { rank: 3, team: 'LG 트윈스', wins: 72, losses: 58, rate: '.554' },
        { rank: 4, team: '두산 베어스', wins: 68, losses: 62, rate: '.523' },
        { rank: 5, team: '롯데 자이언츠', wins: 65, losses: 65, rate: '.500' }
      ]
    };

    function setState(newState) {
      state = { ...state, ...newState };
      render();
    }

    function switchTab(tab) {
      setState({ activeTab: tab });
    }

    function changeDate(days) {
      const dates = ['2026-09-21', '2026-09-22', '2026-09-23'];
      let idx = dates.indexOf(state.selectedDate);
      idx += days;
      if (idx >= 0 && idx < dates.length) {
        setState({ selectedDate: dates[idx] });
      }
    }

    function toggleTeam(team) {
      let teams = [...state.favoriteTeams];
      if (teams.includes(team)) {
        teams = teams.filter(t => t !== team);
      } else {
        teams.push(team);
      }
      setState({ favoriteTeams: teams });
    }

    function render() {
      const app = document.getElementById('app');
      const currentGames = mockGamesByDate[state.selectedDate] || [];
      const myHomeGames = state.showAllGames 
        ? currentGames 
        : currentGames.filter(g => 
            state.favoriteTeams.some(t => g.homeTeam.includes(t.replace(' 자이언츠','').replace(' 마린즈','')) || g.awayTeam.includes(t.replace(' 자이언츠','').replace(' 마린즈','')))
          );

      app.innerHTML = `
        <div class="flex flex-col min-h-screen bg-white text-gray-900 select-none">
          <header class="px-5 pt-6 pb-4 flex justify-between items-center border-b border-gray-100">
            <div>
              <div class="flex items-center gap-1.5">
                <h1 class="text-2xl font-black tracking-tighter m-0">GIP</h1>
                <span class="text-[11px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded font-bold">집</span>
              </div>
              <p class="text-xs text-gray-500 font-medium mt-0.5">야구가 있는 곳, 어디든 우리 집.</p>
            </div>
            <button onclick="switchTab('my')" class="bg-black text-white px-4 py-2 rounded-full text-xs font-bold cursor-pointer">시작하기</button>
          </header>

          ${state.activeTab === 'home' ? `
            <main class="px-5 pt-4">
              <div class="flex items-center justify-between bg-gray-50 px-4 py-3 rounded-2xl mb-6 border border-gray-100">
                <span onclick="changeDate(-1)" class="cursor-pointer text-gray-500 font-bold text-sm hover:text-black">&lt; 어제</span>
                <div class="flex items-center gap-2 text-xs font-extrabold text-gray-800">
                  <span>📅</span> ${state.selectedDate}
                </div>
                <span onclick="changeDate(1)" class="cursor-pointer text-gray-500 font-bold text-sm hover:text-black">내일 &gt;</span>
              </div>

              <section class="mb-8">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="text-base font-extrabold m-0">${state.showAllGames ? '전체 경기' : '우리 집 경기'}</h2>
                  <div class="flex items-center gap-3">
                    <span onclick="setState({ showAllGames: !state.showAllGames })" class="text-xs text-blue-600 cursor-pointer font-bold">
                      ${state.showAllGames ? '내 팀만 보기' : '전체보기'}
                    </span>
                    <span onclick="switchTab('my')" class="text-xs text-gray-400 cursor-pointer font-semibold">팀 설정 &gt;</span>
                  </div>
                </div>
                
                ${myHomeGames.length > 0 ? myHomeGames.map(game => `
                  <div class="border border-gray-200/80 rounded-2xl p-4 mb-3 bg-white shadow-xs">
                    <div class="flex justify-between text-[11px] text-gray-400 font-bold mb-2">
                      <span>${game.league}</span>
                      <span class="${game.status === 'LIVE' ? 'text-red-500 font-black' : ''}">${game.status === 'LIVE' ? '🔴 LIVE' : game.status === 'FINAL' ? 'FINAL' : game.time}</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <div class="text-sm font-bold flex-1 text-left">${game.awayTeam}</div>
                      <div class="text-base font-black px-3">${game.status === 'BEFORE' ? 'VS' : `${game.awayScore} :${game.homeScore}`}</div>
                      <div class="text-sm font-bold flex-1 text-right">${game.homeTeam}</div>
                    </div>
                    <div class="text-center text-[11px] text-gray-400 mt-2.5 font-medium">
                      ${game.stadium}
                    </div>
                  </div>
                `).join('') : `
                  <div class="p-8 text-center text-gray-400 text-xs bg-gray-50 rounded-2xl border border-dashed border-gray-200">
                    선택한 날짜에 설정된 팀의 경기가 없습니다.<br><span class="text-blue-600 font-bold cursor-pointer mt-1 inline-block" onclick="setState({ showAllGames: true })">전체보기로 경기 확인하기</span>
                  </div>
                `}
              </section>
            </main>
          ` : ''}

          ${state.activeTab === 'rank' ? `
            <main class="px-5 pt-4">
              <h2 class="text-xl font-black mb-4">📊 리그 순위</h2>
              <div class="border border-gray-200 rounded-2xl overflow-hidden bg-white">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="bg-gray-50 border-b border-gray-100 text-gray-500">
                      <th class="p-3">순위</th>
                      <th class="p-3">팀명</th>
                      <th class="p-3 text-center">승-패</th>
                      <th class="p-3 text-right">승률</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rankingsData.KBO.map(r => `
                      <tr class="border-b border-gray-50">
                        <td class="p-3 font-bold">${r.rank}</td>
                        <td class="p-3 font-extrabold">${r.team}</td>
                        <td class="p-3 text-center text-gray-600">${r.wins}-${r.losses}</td>
                        <td class="p-3 text-right font-bold">${r.rate}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </main>
          ` : ''}

          ${state.activeTab === 'record' ? `
            <main class="px-5 pt-4">
              <h2 class="text-xl font-black mb-4">📝 응원 기록</h2>
              <div class="border border-dashed border-gray-300 rounded-2xl p-6 text-center bg-gray-50 mb-4">
                <p class="text-xs text-gray-500 font-bold mb-3">나만의 직관 기록을 남겨보세요.</p>
                <button onclick="alert('기록 작성 기능 준비 중입니다!')" class="bg-black text-white px-4 py-2 rounded-xl text-xs font-bold">기록 남기기 +</button>
              </div>
            </main>
          ` : ''}

          ${state.activeTab === 'my' ? `
            <main class="px-5 pt-4">
              <h2 class="text-xl font-black mb-4">마이</h2>
              
              <div class="border border-gray-200 rounded-2xl p-4 mb-4 flex justify-between items-center bg-white">
                <div class="flex gap-3 items-center">
                  <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center font-black text-sm">집</div>
                  <div>
                    <div class="text-sm font-bold">${state.nickname}</div>
                    <div class="text-[11px] text-gray-500">야구를 사랑하는 집사</div>
                  </div>
                </div>
              </div>

              <div class="border border-gray-200 rounded-2xl p-4 mb-4 bg-white">
                <div class="flex justify-between items-center mb-3">
                  <span class="text-sm font-extrabold">⭐ 우리 집 팀 설정</span>
                  <span onclick="setState({ showTeamModal: true })" class="text-xs text-blue-600 cursor-pointer font-bold">변경하기 &gt;</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${state.favoriteTeams.map(team => `
                    <span class="bg-black text-white px-3 py-1 rounded-full text-[11px] font-bold">${team} ✓</span>
                  `).join('')}
                </div>
              </div>
            </main>
          ` : ''}

          ${state.showTeamModal ? `
            <div class="fixed inset-0 bg-black/40 z-50 flex items-end justify-center">
              <div class="bg-white w-full max-w-[430px] h-[80vh] rounded-t-3xl p-6 flex flex-col box-border shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="text-base font-black m-0">🏡 우리집 설정</h3>
                  <button onclick="setState({ showTeamModal: false })" class="bg-transparent border-none text-lg cursor-pointer">✕</button>
                </div>
                <p class="text-[11px] text-gray-500 mb-4">응원하는 팀을 선택하여 우리집을 꾸며보세요.</p>
                
                <input type="text" placeholder="팀 이름을 검색하세요" value="${state.teamSearch}" oninput="setState({ teamSearch: this.value })" class="w-full p-3 rounded-xl border border-gray-200 text-xs mb-4 bg-gray-50 outline-none" />

                <div class="flex-1 overflow-y-auto pr-1">
                  ${continents.map(c => `
                    <div class="mb-3 border border-gray-100 rounded-xl overflow-hidden">
                      <div onclick="setState({ expandedContinent: '${state.expandedContinent === c.name ? '' : c.name}' })" class="p-3.5 bg-gray-50 flex justify-between items-center cursor-pointer font-bold text-xs">
                        <span>${c.name}</span>
                        <span>${state.expandedContinent === c.name ? '▲' : '▼'}</span>
                      </div>
                      ${state.expandedContinent === c.name ? `
                        <div class="p-3">
                          ${c.leagues.map(l => `
                            <div class="mb-2.5">
                              <div class="text-[11px] font-bold text-gray-600 mb-2">${l.name}</div>
                              <div class="flex flex-wrap gap-1.5">
                                ${l.teams.filter(t => !state.teamSearch || t.includes(state.teamSearch)).map(team => {
                                  const isSelected = state.favoriteTeams.includes(team);
                                  return `
                                    <button onclick="toggleTeam('${team}')" class="px-3 py-1.5 rounded-full border border-gray-200 text-[11px] font-bold cursor-pointer ${isSelected ? 'bg-black text-white' : 'bg-white text-gray-900'}">
                                      ${team}${isSelected ? '✓' : '+'}
                                    </button>
                                  `;
                                }).join('')}
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>

                <button onclick="setState({ showTeamModal: false })" class="w-full py-3.5 bg-black text-white border-none rounded-xl text-xs font-extrabold cursor-pointer mt-4">
                  설정 완료
                </button>
              </div>
            </div>
          ` : ''}

          <nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white border-t border-gray-100 flex h-16 z-40">
            <button onclick="switchTab('home')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'home' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">🏠</span>
              <span class="text-[10px]">홈</span>
            </button>
            <button onclick="switchTab('rank')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'rank' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">📊</span>
              <span class="text-[10px]">순위</span>
            </button>
            <button onclick="switchTab('record')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'record' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">📝</span>
              <span class="text-[10px]">기록</span>
            </button>
            <button onclick="switchTab('my')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'my' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">👤</span>
              <span class="text-[10px]">마이</span>
            </button>
          </nav>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
