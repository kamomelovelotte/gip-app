<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIP - 야구가 있는 곳, 어디든 우리 집</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-start min-h-screen">
  <div id="app" class="w-full max-w-[430px] bg-white min-h-screen shadow-xl relative pb-24"></div>

  <script>
    // 상태 관리 데이터
    let state = {
      activeTab: 'home',
      nickname: '야구집사',
      favoriteTeams: ['롯데 자이언츠', '치바 롯데 마린즈', '샌프란시스코 자이언츠'],
      showTeamModal: false,
      selectedDate: '2026-09-22',
      teamSearch: '',
      expandedContinent: '아시아',
      activeInfoModal: null
    };

    const continents = [
      { name: '아시아', leagues: [{ name: 'KBO', teams: ['롯데 자이언츠', '한화 이글스', 'LG 트윈스', '두산 베어스', 'KT 위즈', '삼성 라이온즈', 'NC 다이노스'] }, { name: 'NPB', teams: ['치바 롯데 마린즈', '오릭스 버팔로스', '요미우리 자이언츠'] }] },
      { name: '북미', leagues: [{ name: 'MLB', teams: ['샌프란시스코 자이언츠', 'LA 다저스', '뉴욕 양키스'] }] },
      { name: '남미·카리브', leagues: [{ name: 'LIDOM', teams: ['타이거스 델 레이세이'] }] },
      { name: '유럽', leagues: [{ name: 'DBL', teams: ['하이덴하임 헤비츠'] }] },
      { name: '오세아니아', leagues: [{ name: 'ABL', teams: ['멜버른 에이시스'] }] },
      { name: '여자야구', leagues: [{ name: 'WPBL', teams: ['로스앤젤레스 퀸스', '샌프란시스코 파이어벨스'] }] }
    ];

    const gamesData = [
      { id: 1, league: 'KBO', homeTeam: '한화 이글스', awayTeam: '롯데 자이언츠', homeScore: 3, awayScore: 5, status: 'FINAL', stadium: '사직야구장', time: '14:00' },
      { id: 2, league: 'NPB', homeTeam: '오릭스 버팔로스', awayTeam: '치바 롯데 마린즈', homeScore: 0, awayScore: 0, status: 'BEFORE', stadium: 'ZOZO 마린', time: '18:00' },
      { id: 3, league: 'MLB', homeTeam: 'LA 다저스', awayTeam: '샌프란시스코 자이언츠', homeScore: 2, awayScore: 4, status: 'FINAL', stadium: 'Oracle Park', time: '10:00' }
    ];

    function setState(newState) {
      state = { ...state, ...newState };
      render();
    }

    function switchTab(tab) {
      setState({ activeTab: tab });
    }

    function toggleTeam(team) {
      let teams = [...state.favoriteTeams];
      if (teams.includes(team)) {
        teams = teams.filter(t => t !== team);
      } else {
        teams.push(team);
      }
      setState({ favoriteTeams: teams });
    }

    function render() {
      const app = document.getElementById('app');
      
      const myHomeGames = gamesData.filter(g => 
        state.favoriteTeams.some(t => g.homeTeam.includes(t.replace(' 자이언츠','').replace(' 마린즈','')) || g.awayTeam.includes(t.replace(' 자이언츠','').replace(' 마린즈','')))
      );

      app.innerHTML = `
        <div class="flex flex-col min-h-screen text-gray-900 select-none">
          <header class="px-5 pt-5 pb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-1.5">
                <h1 class="text-2xl font-black tracking-tighter m-0">GIP</h1>
                <span class="text-[11px] text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded font-bold">집</span>
              </div>
              <p class="text-xs text-gray-500 font-semibold mt-0.5">야구가 있는 곳, 어디든 우리 집.</p>
            </div>
            <button onclick="alert('환영합니다! GIP와 함께 야구를 즐겨보세요.')" class="bg-black text-white px-4 py-2 rounded-full text-xs font-bold cursor-pointer hover:bg-gray-800">시작하기</button>
          </header>

          ${state.activeTab === 'home' ? `
            <main class="px-5">
              <div class="flex items-center justify-between bg-gray-50 p-3 rounded-2xl mb-6 mt-2">
                <span class="cursor-pointer text-gray-400 font-bold px-2">&lt;</span>
                <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-sm text-xs font-bold">
                  <span>📅</span> ${state.selectedDate}
                </div>
                <span class="cursor-pointer text-gray-400 font-bold px-2">&gt;</span>
              </div>

              <section class="mb-8">
                <div class="flex justify-between items-center mb-3">
                  <h2 class="text-base font-extrabold m-0">우리 집 경기</h2>
                  <span onclick="switchTab('my')" class="text-xs text-gray-500 cursor-pointer font-semibold hover:underline">팀 설정 &gt;</span>
                </div>
                
                ${myHomeGames.length > 0 ? myHomeGames.map(game => `
                  <div class="border border-gray-200 rounded-2xl p-4 mb-3 bg-white shadow-xs">
                    <div class="flex justify-between text-[11px] text-gray-400 font-bold mb-2">
                      <span>${game.league}</span>
                      <span>${game.status === 'FINAL' ? 'FINAL' : game.time}</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <div class="text-sm font-bold flex-1 text-left">${game.awayTeam}</div>
                      <div class="text-base font-black px-3">${game.status === 'FINAL' ? `${game.awayScore} :${game.homeScore}` : 'VS'}</div>
                      <div class="text-sm font-bold flex-1 text-right">${game.homeTeam}</div>
                    </div>
                    <div class="text-center text-[11px] text-gray-400 mt-2.5">
                      ${state.selectedDate} · ${game.stadium}
                    </div>
                  </div>
                `).join('') : `
                  <div class="p-6 text-center text-gray-400 text-xs bg-gray-50 rounded-2xl">
                    선택된 날짜에 설정된 우리 집 팀 경기가 없습니다.
                  </div>
                `}
              </section>
            </main>
          ` : ''}

          ${state.activeTab === 'my' ? `
            <main class="px-5">
              <h2 class="text-xl font-black my-4">마이</h2>
              
              <div class="border border-gray-200 rounded-2xl p-4 mb-5 flex justify-between items-center bg-white shadow-xs">
                <div class="flex gap-3 items-center">
                  <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center font-black text-sm">집</div>
                  <div>
                    <div class="text-sm font-bold">${state.nickname}</div>
                    <div class="text-[11px] text-gray-500 mt-0.5">나만의 집을 만들어 보세요.</div>
                  </div>
                </div>
                <button onclick="alert('로그인 기능은 준비 중입니다!')" class="bg-white border border-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer">로그인</button>
              </div>

              <div class="border border-gray-200 rounded-2xl p-4 mb-5 bg-white shadow-xs">
                <div class="flex justify-between items-center mb-3">
                  <span class="text-sm font-extrabold">⭐ 우리 집 설정하기</span>
                  <span onclick="setState({ showTeamModal: true })" class="text-xs text-gray-500 cursor-pointer font-bold hover:underline">더보기 &gt;</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${state.favoriteTeams.map(team => `
                    <span class="bg-black text-white px-3 py-1 rounded-full text-[11px] font-bold">${team} ✓</span>
                  `).join('')}
                </div>
              </div>

              <div class="border border-gray-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                <div onclick="setState({ activeInfoModal: 'notice' })" class="p-4 flex justify-between items-center border-b border-gray-100 cursor-pointer text-xs font-bold hover:bg-gray-50">
                  <span>알림 설정</span><span class="text-gray-300">&gt;</span>
                </div>
                <div onclick="setState({ activeInfoModal: 'cs' })" class="p-4 flex justify-between items-center border-b border-gray-100 cursor-pointer text-xs font-bold hover:bg-gray-50">
                  <span>고객센터</span><span class="text-gray-300">&gt;</span>
                </div>
                <div onclick="setState({ activeInfoModal: 'terms' })" class="p-4 flex justify-between items-center border-b border-gray-100 cursor-pointer text-xs font-bold hover:bg-gray-50">
                  <span>이용약관</span><span class="text-gray-300">&gt;</span>
                </div>
                <div onclick="setState({ activeInfoModal: 'privacy' })" class="p-4 flex justify-between items-center cursor-pointer text-xs font-bold hover:bg-gray-50">
                  <span>개인정보처리방침</span><span class="text-gray-300">&gt;</span>
                </div>
              </div>
            </main>
          ` : ''}

          ${state.showTeamModal ? `
            <div class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
              <div class="bg-white w-full max-w-[430px] h-[80vh] rounded-t-3xl p-6 flex flex-col box-border">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="text-base font-black m-0">🏡 우리집 설정</h3>
                  <button onclick="setState({ showTeamModal: false })" class="bg-transparent border-none text-base cursor-pointer font-bold">✕</button>
                </div>
                <p class="text-[11px] text-gray-500 mb-4">응원하는 팀을 선택하여 우리집을 꾸며보세요.</p>
                
                <input type="text" placeholder="팀 이름을 검색하세요" value="${state.teamSearch}" oninput="setState({ teamSearch: this.value })" class="w-full p-3 rounded-xl border border-gray-200 text-xs mb-4 bg-gray-50 outline-none" />

                <div class="flex-1 overflow-y-auto pr-1">
                  ${continents.map(c => `
                    <div class="mb-3 border border-gray-100 rounded-xl overflow-hidden">
                      <div onclick="setState({ expandedContinent: '${state.expandedContinent === c.name ? '' : c.name}' })" class="p-3.5 bg-gray-50 flex justify-between items-center cursor-pointer font-bold text-xs">
                        <span>${c.name}</span>
                        <span>${state.expandedContinent === c.name ? '▲' : '▼'}</span>
                      </div>
                      ${state.expandedContinent === c.name ? `
                        <div class="p-3">
                          ${c.leagues.map(l => `
                            <div class="mb-2.5">
                              <div class="text-[11px] font-bold text-gray-600 mb-2">${l.name}</div>
                              <div class="flex flex-wrap gap-1.5">
                                ${l.teams.filter(t => !state.teamSearch || t.includes(state.teamSearch)).map(team => {
                                  const isSelected = state.favoriteTeams.includes(team);
                                  return `
                                    <button onclick="toggleTeam('${team}')" class="px-3 py-1.5 rounded-full border border-gray-200 text-[11px] font-bold cursor-pointer ${isSelected ? 'bg-black text-white' : 'bg-white text-gray-900'}">
                                      ${team}${isSelected ? '✓' : '+'}
                                    </button>
                                  `;
                                }).join('')}
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>

                <button onclick="setState({ showTeamModal: false })" class="w-full py-3.5 bg-black text-white border-none rounded-xl text-xs font-extrabold cursor-pointer mt-4">
                  설정 완료
                </button>
              </div>
            </div>
          ` : ''}

          ${state.activeInfoModal ? `
            <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-5">
              <div class="bg-white w-full max-w-[320px] rounded-2xl p-5 box-border">
                <h3 class="text-sm font-black mt-0 mb-3">
                  ${state.activeInfoModal === 'notice' ? '알림 설정' : state.activeInfoModal === 'cs' ? '고객센터' : state.activeInfoModal === 'terms' ? '이용약관' : '개인정보처리방침'}
                </h3>
                <p class="text-xs text-gray-600 leading-normal mb-4">
                  ${state.activeInfoModal === 'notice' ? '경기 시작 전 및 결과 알림을 받아보실 수 있습니다.' : 
                    state.activeInfoModal === 'cs' ? '문의사항은 support@gip-baseball.com으로 연락주세요.' : 
                    state.activeInfoModal === 'terms' ? 'GIP 서비스 이용약관 내용입니다. 야구를 사랑하는 모든 분들을 위한 공간입니다.' : 
                    '사용자의 소중한 개인정보는 안전하게 보호되며 목적 외로 사용되지 않습니다.'}
                </p>
                <button onclick="setState({ activeInfoModal: null })" class="w-full py-2.5 bg-black text-white border-none rounded-lg text-xs font-bold cursor-pointer">확인</button>
              </div>
            </div>
          ` : ''}

          <nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white border-t border-gray-100 flex h-16 z-40 shadow-lg">
            <button onclick="switchTab('home')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'home' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">🏠</span>
              <span class="text-[10px]">홈</span>
            </button>
            <button onclick="alert('준비 중인 메뉴입니다!')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer text-gray-400 font-bold">
              <span class="text-base mb-0.5">📊</span>
              <span class="text-[10px]">순위</span>
            </button>
            <button onclick="alert('준비 중인 메뉴입니다!')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer text-gray-400 font-bold">
              <span class="text-base mb-0.5">📝</span>
              <span class="text-[10px]">기록</span>
            </button>
            <button onclick="switchTab('my')" class="flex-1 border-none bg-transparent flex flex-col items-center justify-center cursor-pointer ${state.activeTab === 'my' ? 'text-black font-black' : 'text-gray-400 font-bold'}">
              <span class="text-base mb-0.5">👤</span>
              <span class="text-[10px]">마이</span>
            </button>
          </nav>
        </div>
      `;
    }

    // 최초 실행
    render();
  </script>
</body>
</html>
